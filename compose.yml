# Example Compose file. Edit the publish address, Home Assistant URL, and host
# paths before use (or copy .env.example to .env and change the values there).
# The token file is a Compose secret, mounted read-only at /run/secrets/ha_token.
# Do not commit that file.
# SOURCE_MODE=homeassistant does not poll the Neurio and has no device fallback.
# Do not set NEURIO_URL in this mode.

name: neurio-lan-collector

services:
  neurio-recorder:
    image: neurio-lan-collector:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.25
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - ${DATA_HOST_PATH:-/srv/neurio-recorder/data}:/data
      - ${BACKUP_HOST_PATH:-/srv/neurio-recorder/backups}:/backups
    secrets:
      - ha_token
    ports:
      - "${PUBLISH_ADDRESS:-192.168.1.20}:8095:8095"
    environment:
      SOURCE_MODE: "homeassistant"
      HA_URL: "${HA_URL:-http://192.168.1.10:8123}"
      HA_ALLOW_RFC1918_HTTP: "accept-unencrypted-bearer"
      HA_ENTITY: "${HA_ENTITY:-sensor.neurio_raw}"
      HA_SOURCE_ID: "${HA_SOURCE_ID:-ha-relay:sensor.neurio_raw}"
      HA_TOKEN_FILE: "/run/secrets/ha_token"
      BIND_ADDRESS: "0.0.0.0"
      BIND_PORT: "8095"
      ALLOW_CONTAINER_WILDCARD_BIND: "host-publish-pinned"
      DATA_DIR: "/data"
      NEURIO_POLL_INTERVAL_SECONDS: "15"
      NEURIO_POLL_TIMEOUT_SECONDS: "3"
      NEURIO_POLL_MAX_BACKOFF_SECONDS: "300"
      NEURIO_TIMEZONE: "America/Chicago"
      NEURIO_TOPOLOGY_VERIFIED: "false"
      NEURIO_CONSUMPTION_SOURCE: "consumption_channel"
      NEURIO_REDACT_IDENTITY: "true"
      NEURIO_RAW_RETENTION_DAYS: "0"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8095/healthz', timeout=2).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  ha_token:
    file: ${HA_TOKEN_HOST_FILE:-/srv/neurio-recorder/ha_token}
